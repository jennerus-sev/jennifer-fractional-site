{{ $home := cond .IsHome "" site.Home.RelPermalink }}
<header class="site-header">
  <a class="wordmark" href="{{ $home }}#top"><strong>Jennifer Severns</strong><span>·</span><small>Fractional executive</small></a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
    <a href="{{ $home }}#when">Services</a>
    {{ if .Params.case_study }}
      <div class="work-nav" id="work-nav">
        <button id="work-toggle" type="button" aria-controls="work-menu" aria-expanded="false">Work <span class="work-caret" aria-hidden="true"></span></button>
        <div class="work-menu" id="work-menu" hidden>
          <a href="#main" aria-current="page">{{ .LinkTitle }}</a>
        </div>
      </div>
    {{ else }}
      <a href="{{ $home }}#work">Work</a>
    {{ end }}
    <a href="{{ $home }}#about">About</a>
    <a href="{{ $home }}#faq">FAQ</a>
    <a class="nav-cta" href="{{ $home }}#contact">Contact</a>
  </nav>
</header>
