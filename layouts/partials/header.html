{{ $current := . }}
{{ $home := cond .IsHome "" site.Home.RelPermalink }}
<header class="site-header">
  <a class="wordmark" href="{{ $home }}#top"><strong>Jennifer Severns</strong><span>·</span><small>Fractional executive</small></a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
    <a href="{{ $home }}#when">Services</a>
    {{ with where site.RegularPages "Params.case_study" true }}
      <div class="work-nav{{ if $current.Params.case_study }} is-current{{ end }}">
        <button class="work-toggle" type="button" aria-controls="work-menu" aria-expanded="false">Work <span class="work-caret" aria-hidden="true"></span></button>
        <div class="work-menu" id="work-menu" hidden>
          <a href="{{ $home }}#work">Selected Work</a>
          {{ range .ByTitle }}
            <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current.RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
          {{ end }}
        </div>
      </div>
    {{ else }}
      <a href="{{ $home }}#work">Work</a>
    {{ end }}
    <a href="{{ $home }}#about">About</a>
    <a href="{{ $home }}#faq">FAQ</a>
    <a class="nav-cta" href="{{ $home }}#contact">Contact</a>
  </nav>
</header>
