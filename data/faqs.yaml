- question: What does a fractional customer experience and transformation executive do?
  answer: "A fractional customer experience and transformation executive provides senior leadership for a defined portion of the week or month, helping an organization connect strategy to execution across customer journeys, operations, technology, and people.\n\n### Isn’t that marketing?\n\nMarketing creates demand and shapes how people understand an organization. Customer experience covers what people encounter across the full relationship, from discovery and enrollment or purchase through service, use, renewal, and advocacy. My work helps the organization manage that whole system, not only its communications."
- question: When should an organization hire a fractional executive?
  answer: "Fractional leadership is useful when consequential work needs senior judgment and momentum, but a permanent executive hire is not yet necessary or practical. Common signals include a strong strategy that is not translating into action, fragmented ownership across departments, a temporary leadership gap, or technology and AI advancing faster than adoption and trust."
- question: What kinds of organizations do you work with?
  answer: "I work especially well with complex, service-driven organizations in healthcare, benefits, financial services, insurance, and membership. These environments often have customer journeys that cross departments, tightly connected technology and operations, regulatory considerations, and many stakeholders who must align before change can take hold. I also consider adjacent organizations facing similar systems-level challenges."
- question: How is fractional leadership different from consulting?
  answer: "Traditional consulting often centers on analysis, recommendations, or a defined deliverable. Fractional leadership is more embedded and accountable. I work alongside executives and teams to make decisions, establish priorities and operating rhythms, move work forward, and build the internal capability to continue after the engagement. Depending on the need, an engagement may include both advisory and hands-on leadership."
- question: What are your AI (generative artificial intelligence) policies?
  answer: "I use generative AI selectively to support research, synthesis, exploration, and efficiency, never as a substitute for judgment or accountable decision-making. I do not place confidential, proprietary, personal, or regulated client information into public AI systems. Any client use follows agreed policies, access controls, and disclosure requirements. I help teams evaluate use cases for value, privacy, security, bias, governance, and adoption before scaling them."
- question: Do you work with existing executives and internal teams?
  answer: "Yes. My role is designed to strengthen the leadership and expertise already inside the organization. I partner with executives, functional leaders, and delivery teams to clarify ownership, connect decisions across departments, and create a practical way of working. The goal is shared capability and momentum, not dependency on an outside leader."
- question: How much does a fractional engagement cost?
  answer: "Fees are tailored to the scope, complexity, leadership involvement, and value of the outcome. Engagements may take the form of an ongoing monthly partnership, a defined transformation initiative, or a focused executive intensive. After an initial conversation, I recommend the structure that fits the work and make the investment clear before an engagement begins."
