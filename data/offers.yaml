- name: "Fractional Leadership"
  price: "Custom monthly retainer"
  label: "Ongoing partnership"
  description: "A senior operating partner embedded across leadership, teams, and priority work to provide sustained judgment, alignment, and momentum."
  includes:
    - "Regular executive and team working time"
    - "Strategy, facilitation, and hands-on leadership"
    - "Shared priorities, measures, and operating cadence"
    - "Flexible involvement during high-need periods"
  note: "Most fractional partnerships begin with a three-month commitment."
- name: "Defined engagement"
  price: "Fixed fee based on scope and value"
  label: "A focused outcome"
  description: "A fixed engagement designed around a challenge such as an experience strategy, operating model, customer journey, AI-readiness plan, or organizational transformation."
  includes:
    - "Clear scope, deliverables, and decision points"
    - "Research and stakeholder alignment as needed"
    - "Practical tools and frameworks your team can use"
    - "Defined investment proposed before work begins"
  note: "Best for important work with a clear destination and defined boundaries."
- name: "Executive intensive"
  price: "Fixed-fee intensive"
  label: "Clarity in two weeks"
  description: "A concentrated diagnostic for leaders who need a sharper definition of the problem, stronger alignment, and a credible path forward."
  includes:
    - "Leadership intake and targeted stakeholder conversations"
    - "Current-state synthesis"
    - "In-depth executive working session"
    - "Concise action framework and recommended next steps"
  note: "May serve as the starting point for a larger engagement."
