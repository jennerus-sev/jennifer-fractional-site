- name: "Fractional leadership"
  price: "$12,000 / month"
  label: "Ongoing partnership"
  description: "A senior operating partner embedded approximately 10 hours per week across leadership, teams, and priority work."
  includes:
    - "Weekly executive and team working time"
    - "Strategy, facilitation, and hands-on momentum"
    - "Shared roadmap, measures, and operating cadence"
    - "Up to 10 additional flex hours in a high-need week with approval / agreement"
  note: "Recommended initial commitment: 3 months"
- name: "Defined engagement"
  price: "Scoped to the work"
  label: "A focused outcome"
  description: "A fixed engagement for a clear challenge such as an experience strategy, operating model, journey, AI-readiness plan, or leadership workshop."
  includes:
    - "Clear scope, deliverables, and decision points"
    - "Research and stakeholder alignment as needed"
    - "Practical artifacts your team can use"
    - "Fixed fee proposed before work begins"
  note: "Typical engagements begin at $15,000"
- name: "Executive intensive"
  price: "$4,800"
  label: "Clarity in two weeks"
  description: "A compact diagnostic for leaders who need a sharper problem definition and a credible path forward."
  includes:
    - "Leadership intake and targeted interviews"
    - "Current-state synthesis"
    - "90-minute decision session"
    - "Concise action framework and next-step brief"
  note: "Fee may be credited toward a larger engagement"
